name: Playwright (Python + pytest)

on:
  push:
    branches: [main]
    paths:
      - 'playwright-python-pytest/**'
      - '.github/workflows/playwright-python-pytest.yml'
  pull_request:
    paths:
      - 'playwright-python-pytest/**'
      - '.github/workflows/playwright-python-pytest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playwright-python-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-python-pytest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: playwright-python-pytest/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (${{ matrix.browser }})
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: pytest -n 2 --reruns 2 --reruns-delay 5 --browser ${{ matrix.browser }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: playwright-python-pytest/allure-results
          retention-days: 7

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Collect Allure results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Check out published report branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Carry over trend history
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/playwright-python-pytest/history/* allure-results/history/ 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Publish report to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: playwright-python-pytest

      - name: Retry publish if another project published at the same time
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        run: sleep 30

      - name: Publish report to GitHub Pages (retry)
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: playwright-python-pytest

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Playwright (Python + pytest)* - tests: `${{ needs.test.result }}`\nReport: https://hrehoryjj.github.io/QA-Automation-Portfolio/playwright-python-pytest/\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
