name: LLM Testing (DeepEval)

on:
  push:
    branches: [main]
    paths:
      - 'llm-testing-deepeval/**'
      - '.github/workflows/llm-testing-deepeval.yml'
  pull_request:
    paths:
      - 'llm-testing-deepeval/**'
      - '.github/workflows/llm-testing-deepeval.yml'
  workflow_dispatch:

concurrency:
  group: llm-testing-deepeval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-testing-deepeval
    env:
      LOCAL_LLM_BASE_URL: http://localhost:11434/v1
      LOCAL_LLM_MODEL: qwen2.5:7b-instruct
      LOCAL_LLM_API_KEY: ollama
      DEEPEVAL_PER_TASK_TIMEOUT_SECONDS_OVERRIDE: '600'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: llm-testing-deepeval/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 2
          done

      - name: Pull model
        run: ollama pull "$LOCAL_LLM_MODEL"

      - name: Run tests
        run: pytest -v --reruns 1 --reruns-delay 5 --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: llm-testing-deepeval/report.xml
          retention-days: 7
