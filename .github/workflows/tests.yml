name: E2E Tests

on:
  push:
    branches: [main, task.7]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t telnyx-tests ./task.7

      - name: Run E2E tests in Docker (Chrome, headless)
        run: |
          mkdir -p task.7/allure-results task.7/errorShots
          docker run --rm \
            -v ${{ github.workspace }}/task.7/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/task.7/errorShots:/app/errorShots \
            telnyx-tests

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: task.7/errorShots/

      - name: Setup Node.js (for Allure CLI)
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure report
        if: always()
        run: allure generate task.7/allure-results --clean -o allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report