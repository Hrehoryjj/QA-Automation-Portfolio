name: Appium Mobile (BrowserStack)

on:
  push:
    branches: [main]
    paths:
      - 'appium-mobile-browserstack/**'
      - '.github/workflows/appium-mobile-browserstack.yml'
  pull_request:
    paths:
      - 'appium-mobile-browserstack/**'
      - '.github/workflows/appium-mobile-browserstack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appium-mobile-browserstack
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests on device 1 (Samsung Galaxy S22 Ultra)
        run: npx wdio run wdio.conf.js

      - name: Run tests on device 2 (Google Pixel 8 Pro)
        run: npx wdio run wdio.device2.conf.js

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: appium-mobile-browserstack/allure-report

      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: appium-mobile-browserstack/allure-report
          destination_dir: appium-mobile-browserstack
