name: Flutter Widget Tests

on:
  push:
    branches: [main]
    paths:
      - 'flutter-widget-tests/**'
      - '.github/workflows/flutter-widget-tests.yml'
  pull_request:
    paths:
      - 'flutter-widget-tests/**'
      - '.github/workflows/flutter-widget-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-widget-tests
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run widget tests
        run: flutter test test/widget_test.dart --reporter expanded
