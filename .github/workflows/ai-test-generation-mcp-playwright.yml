name: AI Test Generation (Playwright MCP)

on:
  push:
    paths:
      - 'ai-test-generation-mcp/**'
      - '.github/workflows/ai-test-generation-mcp-*.yml'
  pull_request:
    paths:
      - 'ai-test-generation-mcp/**'
      - '.github/workflows/ai-test-generation-mcp-*.yml'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-test-generation-mcp/playwright-project/package-lock.json

      - name: Install dependencies
        working-directory: ai-test-generation-mcp/playwright-project
        run: npm ci

      - name: Lint and format check
        working-directory: ai-test-generation-mcp/playwright-project
        run: |
          npm run lint
          npm run format:check

      - name: Install Playwright Browsers
        working-directory: ai-test-generation-mcp/playwright-project
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ai-test-generation-mcp/playwright-project
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ai-test-generation-mcp/playwright-project/playwright-report/
          retention-days: 14
