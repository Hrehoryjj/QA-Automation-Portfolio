name: Task 12 Playwright Tests

on:
  push:
    paths:
      - 'task.12/**'
      - '.github/workflows/task12-*.yml'
  pull_request:
    paths:
      - 'task.12/**'
      - '.github/workflows/task12-*.yml'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: task.12/playwright-project/package-lock.json

      - name: Install dependencies
        working-directory: task.12/playwright-project
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: task.12/playwright-project
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: task.12/playwright-project
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: task.12/playwright-project/playwright-report/
          retention-days: 14
